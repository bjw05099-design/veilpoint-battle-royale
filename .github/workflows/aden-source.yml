name: VEILPOINT public Aden terrain source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/aden-source.yml
      - scripts/import-aden-glo30.py
      - scripts/export-aden-civilian-osm.py
      - scripts/aden_source_geometry.py
      - scripts/build-native-aden-source.py
      - scripts/build-native-aden-region.py
      - scripts/aden_west_source.py
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenWestData.h
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenRegionalData.h
      - scripts/build-native-aden-atlas.py
      - scripts/build-native-aden-dispatch.py
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenDispatchRouteData.h
      - Unreal/Veilpoint/ContentSource/Aden/**
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenEmbedded.h
      - scripts/export-ue5-heightmaps.cjs
      - scripts/verify-ue5-tile-pack.cjs
  pull_request:
    paths:
      - .github/workflows/aden-source.yml
      - scripts/import-aden-glo30.py
      - scripts/export-aden-civilian-osm.py
      - scripts/aden_source_geometry.py
      - scripts/build-native-aden-source.py
      - scripts/build-native-aden-region.py
      - scripts/aden_west_source.py
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenWestData.h
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenRegionalData.h
      - scripts/build-native-aden-atlas.py
      - scripts/build-native-aden-dispatch.py
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenDispatchRouteData.h
      - Unreal/Veilpoint/ContentSource/Aden/**
      - Unreal/Veilpoint/Source/Veilpoint/VPAdenEmbedded.h
      - scripts/export-ue5-heightmaps.cjs
      - scripts/verify-ue5-tile-pack.cjs
jobs:
  terrain-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify the public GLO-30 inputs
        run: |
          python -m pip install rasterio==1.5.2 numpy==2.3.5 pillow==13.0.0
          mkdir -p "$RUNNER_TEMP/aden"
          for longitude in 044 045; do
            object="Copernicus_DSM_COG_10_N12_00_E${longitude}_00_DEM"
            curl --fail --location --silent --show-error --max-time 90 --retry 2 \
              "https://copernicus-dem-30m.s3.amazonaws.com/$object/$object.tif" \
              --output "$RUNNER_TEMP/aden/$object.tif"
          done
          cd "$RUNNER_TEMP/aden"
          sha256sum -c <<'SUMS'
          2458629f63c54d25da812285566ed628e204611623b296517cc4f8282a8ead1a  Copernicus_DSM_COG_10_N12_00_E044_00_DEM.tif
          dc25233ef08c57e117eb5fb01c246ae2550ef7131c5829fabad67cdc42821473  Copernicus_DSM_COG_10_N12_00_E045_00_DEM.tif
          SUMS
      - name: Build the projected GeoTIFF, browser input and UE5 R16 candidates
        run: |
          python scripts/import-aden-glo30.py dist/aden-source "$RUNNER_TEMP"/aden/*.tif \
            --acquired-date "$(date -u +%F)" \
            --civilian-source Unreal/Veilpoint/ContentSource/Aden/aden-civilian-pilot.geojson.gz
          node scripts/export-ue5-heightmaps.cjs dist/aden-source/aden-pilot-heightfield.json dist/aden-source/ue5-r16
          node scripts/verify-ue5-tile-pack.cjs dist/aden-source/ue5-r16 > dist/aden-source/R16_VERIFICATION.json
          node -e 'const result=require("./dist/aden-source/R16_VERIFICATION.json"); if(result.tiles!==49||result.seams!==84)process.exit(1);'
      - name: Rebuild and compare the exact native C++ payload
        run: |
          python scripts/build-native-aden-source.py dist/aden-source "$RUNNER_TEMP/VPAdenEmbedded.h"
          cmp "$RUNNER_TEMP/VPAdenEmbedded.h" Unreal/Veilpoint/Source/Veilpoint/VPAdenEmbedded.h
          python scripts/build-native-aden-region.py dist/aden-source "$RUNNER_TEMP/VPAdenRegionalData.h"
          cmp "$RUNNER_TEMP/VPAdenRegionalData.h" Unreal/Veilpoint/Source/Veilpoint/VPAdenRegionalData.h
          python scripts/aden_west_source.py dist/aden-source "$RUNNER_TEMP/VPAdenWestData.h"
          cmp "$RUNNER_TEMP/VPAdenWestData.h" Unreal/Veilpoint/Source/Veilpoint/VPAdenWestData.h
          sha256sum "$RUNNER_TEMP/VPAdenEmbedded.h"
      - name: Verify follow-up routes against registered public roads and clearance
        run: |
          python scripts/build-native-aden-dispatch.py dist/aden-source "$RUNNER_TEMP/VPAdenDispatchRouteData.h"
          cmp "$RUNNER_TEMP/VPAdenDispatchRouteData.h" Unreal/Veilpoint/Source/Veilpoint/VPAdenDispatchRouteData.h
      - name: Compare the cooked atlas source pixels
        run: |
          python scripts/build-native-aden-atlas.py dist/aden-source "$RUNNER_TEMP/atlas"
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          committed = Path("Unreal/Veilpoint/ContentSource/Aden")
          generated = Path(os.environ["RUNNER_TEMP"]) / "atlas"
          a, b = (json.loads((folder / "aden-atlas.json").read_bytes()) for folder in (committed, generated))
          assert a["revision"] == b["revision"]
          import hashlib
          from PIL import Image
          for name, layer in a["layers"].items():
              with Image.open(committed / name) as image:
                  assert hashlib.sha256(image.convert("RGB").tobytes()).hexdigest() == layer["pixelSha256"]
              assert hashlib.sha256((committed / name).read_bytes()).hexdigest() == layer["pngSha256"]
              assert all(layer[key] == b["layers"][name][key] for key in ("boundsCm", "size", "pixelSha256"))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: veilpoint-aden-public-terrain
          path: dist/aden-source/
          if-no-files-found: error
