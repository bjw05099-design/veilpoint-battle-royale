name: VEILPOINT Windows offline EXE host candidate
on:
  push:
    branches: ['**']
    paths:
      - 'windows/**'
      - 'scripts/package-windows-demo.ps1'
      - '.github/workflows/windows-demo-exe.yml'
      - 'index.html'
      - 'story.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/DEMO_DELIVERY_GATES.md'
      - 'docs/GRAPHICS_PROFILES.md'
      - 'scripts/package-offline-demo.cjs'
      - 'scripts/verify-offline-demo.cjs'
      - 'scripts/verify-ch01-routes.cjs'
      - 'scripts/verify-pc-viewport.cjs'
      - 'scripts/validate-pc-geometry.cjs'
      - 'tests/pc-geometry-evidence.test.cjs'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/package-windows-demo.ps1'
      - '.github/workflows/windows-demo-exe.yml'
      - 'index.html'
      - 'story.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/DEMO_DELIVERY_GATES.md'
      - 'docs/GRAPHICS_PROFILES.md'
      - 'scripts/package-offline-demo.cjs'
      - 'scripts/verify-offline-demo.cjs'
      - 'scripts/verify-ch01-routes.cjs'
      - 'scripts/verify-pc-viewport.cjs'
      - 'scripts/validate-pc-geometry.cjs'
      - 'tests/pc-geometry-evidence.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win64-demo-host:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify existing browser game contract
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Browser source syntax gate failed' }
      - name: Verify Windows menu geometry contracts
        shell: pwsh
        run: |
          node --test tests/pc-chromium-geometry-gate.test.cjs tests/pc-geometry-evidence.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Win64 menu release contracts failed' }
      - name: Verify cross-mode PC gameplay controllers on Windows
        shell: pwsh
        run: |
          node --test tests/desktop-controls.test.cjs tests/br-browser.test.cjs tests/story-browser.test.cjs tests/team-client-browser.test.cjs tests/team-match.test.cjs tests/pc-checkpoint-download-fallback.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Win64 BR, CH01, team, and checkpoint controller tests failed' }
      - name: Compile real Win64 EXE and package verified offline game
        shell: pwsh
        run: |
          ./scripts/package-windows-demo.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXE package script failed' }
      - name: Verify authored CH01 route states on Windows
        shell: pwsh
        run: |
          node scripts/verify-ch01-routes.cjs --output dist/windows-exe/ch01-route-evidence-win64.json
          if ($LASTEXITCODE -ne 0) { throw 'CH01 route smoke verification failed' }
      - name: Verify Win64 Chromium screen bounds and clickable controls
        shell: pwsh
        run: |
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {
            $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chrome)) { throw 'Google Chrome is required for Win64 UI verification' }
          $env:CHROME_BIN = $chrome
          node scripts/verify-pc-viewport.cjs --output dist/windows-exe/pc-ui-geometry-win64.json
          if ($LASTEXITCODE -ne 0) { throw 'Win64 viewport controls/clipping gate failed' }
      - name: Package independent BR-free Story CH01 Windows EXE
        shell: pwsh
        run: |
          ./scripts/package-windows-story-demo.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Story-only Win64 package failed' }
      - name: Upload independent Story CH01 Windows EXE candidate + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-story-windows-exe-candidate
          path: |
            dist/windows-story-exe/veilpoint-story-windows-exe.zip
            dist/windows-story-exe/veilpoint-story-windows-exe.zip.sha256
          if-no-files-found: error
          retention-days: 45
      - name: Upload unsigned Windows EXE demo candidate + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-windows-demo-exe-candidate
          path: |
            dist/windows-exe/veilpoint-windows-demo-exe.zip
            dist/windows-exe/veilpoint-windows-demo-exe.zip.sha256
            dist/windows-exe/ch01-route-evidence-win64.json
            dist/windows-exe/pc-ui-geometry-win64.json
          if-no-files-found: error
          retention-days: 45
