name: VEILPOINT offline gameplay and story tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run deterministic simulation tests
        run: npm test
      - name: Verify real Chromium PC menus at four viewport sizes
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          else
            echo "Chrome is required to validate viewport geometry" >&2
            exit 1
          fi
          node scripts/verify-pc-viewport.cjs --output dist/pc-ui-geometry.json
      - name: Validate Unreal project descriptor
        run: python3 -m json.tool Unreal/Veilpoint/Veilpoint.uproject > /dev/null
      - name: Build and verify reproducible offline demo ZIP
        run: |
          npm run package:demo
          cd dist
          sha256sum -c veilpoint-offline-demo.zip.sha256
          unzip -t veilpoint-offline-demo.zip
      - name: Build and certify independent Story CH01-only offline ZIP
        run: |
          npm run package:story-preview
          cd dist/story-first
          sha256sum -c veilpoint-story-preview.zip.sha256
          unzip -t veilpoint-story-preview.zip
      - name: Upload story-only browser candidate (no Battle Royale)
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-story-only-browser-candidate
          path: |
            dist/story-first/veilpoint-story-preview.zip
            dist/story-first/veilpoint-story-preview.zip.sha256
            dist/story-first/START_HERE.txt
          if-no-files-found: error
      - name: Verify both CH01 endings and record checkpoint evidence
        run: node scripts/verify-ch01-routes.cjs --output dist/ch01-route-evidence.json
      - name: Upload offline demo ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-offline-demo-candidate
          path: |
            dist/veilpoint-offline-demo.zip
            dist/veilpoint-offline-demo.zip.sha256
            dist/START_HERE.txt
            dist/ch01-route-evidence.json
            dist/pc-ui-geometry.json
            dist/br96-combat-browser.png
      - name: Upload browser prototype
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-browser-prototype
          path: |
            index.html
            story.html
            src/
            README.md
