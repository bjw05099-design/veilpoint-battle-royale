name: VEILPOINT offline simulation tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run deterministic simulation tests
        run: npm test
      - name: Validate Unreal project descriptor
        run: python3 -m json.tool Unreal/Veilpoint/Veilpoint.uproject > /dev/null
      - name: Upload browser prototype
        uses: actions/upload-artifact@v4
        with:
          name: veilpoint-browser-prototype
          path: |
            index.html
            src/
            README.md
